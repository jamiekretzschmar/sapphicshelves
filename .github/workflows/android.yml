name: Build Android APK

on:
  push:
    branches:
      - main
      - master  # Added just in case your main branch is named 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npx vite build
        env:
           # This tells the builder to grab the key from GitHub's vault
           VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sapphic-shelves-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

