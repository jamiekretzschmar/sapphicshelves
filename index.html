<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#BFB5B2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1E23" media="(prefers-color-scheme: dark)">
  <title>Sapphic Shelves | Android Archive</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            parchment: 'rgb(var(--rgb-parchment) / <alpha-value>)',
            ink: 'rgb(var(--rgb-ink) / <alpha-value>)',
            'mica-surface': 'rgb(var(--rgb-mica) / <alpha-value>)',
            primary: 'rgb(var(--rgb-primary) / <alpha-value>)',
            // Earth Rainbow
            rose: 'rgb(var(--rgb-rose) / <alpha-value>)',
            gold: 'rgb(var(--rgb-gold) / <alpha-value>)',
            peach: 'rgb(var(--rgb-peach) / <alpha-value>)',
            moss: 'rgb(var(--rgb-moss) / <alpha-value>)',
            plum: 'rgb(var(--rgb-plum) / <alpha-value>)',
          },
          fontFamily: {
            header: ['"Cormorant Garamond"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    :root {
      /* LIGHT THEME - Earth Tones */
      --rgb-parchment: 191 181 178;
      --rgb-ink: 45 42 38;
      --rgb-mica: 255 255 255; 
      --rgb-primary: 101 116 191; /* Muted Dusty Blue */
      
      --rgb-rose: 186 107 107;
      --rgb-gold: 212 165 118;
      --rgb-peach: 231 223 142;
      --rgb-moss: 133 193 131;
      --rgb-plum: 101 116 191;
    }

    [data-theme="dark"] {
      /* DARK THEME - Deep Earth */
      --rgb-parchment: 30 30 35;
      --rgb-ink: 230 230 230;
      --rgb-mica: 45 45 50; /* DARKER MICA FOR BUTTONS */
      --rgb-primary: 133 193 131; /* Muted Moss Green */
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: rgb(var(--rgb-parchment));
      font-family: 'Inter', sans-serif;
      /* Prevents blue highlight on Android taps */
      -webkit-tap-highlight-color: transparent; 
    }

    /* BOLDER SEARCH BAR */
    input[type="text"], input[type="search"] {
      border: 2.5px solid rgb(var(--rgb-primary)) !important;
      background-color: rgba(var(--rgb-mica), 0.6) !important;
      border-radius: 12px !important;
      padding: 12px !important;
      font-weight: 500;
    }

    /* DARKENED UNFILTERED BUTTONS */
    .filter-btn:not(.active), button:not([class*="bg-primary"]) {
      background-color: rgb(var(--rgb-mica)) !important;
      color: rgb(var(--rgb-ink)) !important;
      border: 1px solid rgba(var(--rgb-ink), 0.1) !important;
      opacity: 0.9;
    }

    .android-device {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: rgb(var(--rgb-parchment));
    }

    /* Elegant Book Headers */
    h1, h2, h3, .font-header {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 120px; /* Space for Nav */
      padding-top: env(safe-area-inset-top);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: calc(70px + env(safe-area-inset-bottom));
      background: rgba(var(--rgb-parchment), 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(var(--rgb-ink), 0.1);
      z-index: 100;
    }
  </style>
</head>
<body class="antialiased">
  <div id="root" class="android-device"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
