
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E4DFDA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#011D4D" media="(prefers-color-scheme: dark)">
  <title>Sapphic Shelves | Android Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            parchment: 'rgb(var(--rgb-parchment) / <alpha-value>)',
            ink: 'rgb(var(--rgb-ink) / <alpha-value>)',
            'mica-surface': 'rgb(var(--rgb-mica) / <alpha-value>)',
            brand: {
              deep: '#011D4D',
              cyan: '#1282A2',
              glow: '#4A9EA6',
            },
            plum: '#63372C',
            rose: '#D1345B',
            gold: '#C5A028',
            sunset: '#9A463D',
            md: {
              sys: {
                primary: 'rgb(var(--rgb-primary) / <alpha-value>)',
                surface: 'rgb(var(--rgb-parchment) / <alpha-value>)',
                onSurface: 'rgb(var(--rgb-ink) / <alpha-value>)',
              }
            }
          },
          fontFamily: {
            header: ['Cormorant Garamond', 'serif'],
            sans: ['Instrument Sans', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      /* LIGHT THEME */
      --rgb-parchment: 242 240 236;
      --rgb-ink: 10 25 47;
      --rgb-mica: 255 255 255;
      --rgb-primary: 3 64 120;
    }

    [data-theme="dark"] {
      /* DARK THEME */
      --rgb-parchment: 5 10 20;
      --rgb-ink: 230 230 230;
      --rgb-mica: 13 25 45;
      --rgb-primary: 100 181 246;
    }

    [data-theme="sepia"] {
      /* SEPIA THEME */
      --rgb-parchment: 236 228 217;
      --rgb-ink: 60 45 35;
      --rgb-mica: 245 238 225;
      --rgb-primary: 140 70 30;
    }
    
    html, body {
      height: 100%;
      overflow: hidden; /* Prevent body scroll, let React app handle it */
    }
    
    body {
      background-color: rgb(var(--rgb-parchment)); /* Match app bg to hide letters boxing */
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Instrument Sans', sans-serif;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Android Device Shell - DESKTOP ONLY */
    .android-device {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgb(var(--rgb-parchment));
      /* Create new stacking context for fixed children to contain them */
      transform: translateZ(0); 
    }
    
    @media (min-width: 481px) {
      body {
        background-color: #111;
      }
      .android-device {
        height: 850px;
        width: 400px; /* More realistic phone width */
        border-radius: 40px;
        border: 8px solid #333;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
      }
      /* Hide scrollbar on desktop wrapper for cleanliness */
      .android-device ::-webkit-scrollbar {
        display: none;
      }
    }

    .screen {
      flex: 1;
      background-color: rgb(var(--rgb-parchment));
      color: rgb(var(--rgb-ink));
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      /* Safe area padding handled in Layout.tsx via inline styles to avoid double padding */
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain; /* Prevents pull-to-refresh */
      padding-bottom: 100px;
    }
    
    /* Navigation */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(70px + env(safe-area-inset-bottom)); /* Reduced height */
      background: rgba(var(--rgb-parchment), 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(var(--rgb-ink), 0.05);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 10px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 50;
    }

    /* Floating Action Button */
    .fab {
      position: absolute;
      bottom: calc(85px + env(safe-area-inset-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: rgb(var(--rgb-primary));
      color: rgb(var(--rgb-parchment));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 60;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fab:active { transform: scale(0.9); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.sh/@google/genai@^1.36.0",
      "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
      "vite": "https://esm.sh/vite@^7.3.1",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
    }
  }
  </script>
<style>
  /* 1. Define High-Contrast Colors */
  :root {
    /* Default (Sepia/Light): Darker text for readability */
    --rgb-ink: 20 20 20; /* Almost pure black (was likely lighter grey/brown) */
    --rgb-parchment: 240 238 230; /* Your existing background */
  }

  [data-theme="dark"] {
    /* Dark Mode: Lighter text for readability */
    --rgb-ink: 235 235 235; /* Bright white-grey (was likely dimmer) */
    --rgb-parchment: 1 29 77; /* Your Deep Brand Blue */
  }

  /* 2. Fix Safe Areas */
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);

    /* THE FIX: Use Dynamic Height & Border Box */
    height: 100dvh;        /* Fits the actual visible screen perfectly */
    box-sizing: border-box; /* Makes sure Padding doesn't add extra height */
    overflow: hidden;       /* OPTIONAL: Locks the page so it doesn't "bounce" */

    /* Apply the colors */
    color: rgb(var(--rgb-ink));
    background-color: rgb(var(--rgb-parchment));
  }

  nav, .bottom-nav {
    margin-bottom: env(safe-area-inset-bottom);
  }
</style>

</head>
<body class="antialiased">
  <div id="root" style="width: 100%; height: 100%; display: flex; justify-content: center;"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
