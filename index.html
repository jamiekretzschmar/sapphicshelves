<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#E4DFDA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#011D4D" media="(prefers-color-scheme: dark)">
  <title>Sapphic Shelves | Android Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            parchment: 'rgb(var(--rgb-parchment) / <alpha-value>)',
            ink: 'rgb(var(--rgb-ink) / <alpha-value>)',
            'mica-surface': 'rgb(var(--rgb-mica) / <alpha-value>)',
            brand: {
              deep: '#011D4D',
              cyan: '#1282A2',
              glow: '#4A9EA6',
            },
            plum: '#63372C',
            rose: '#D1345B',
            gold: '#C5A028',
            sunset: '#9A463D',
            md: {
              sys: {
                primary: 'rgb(var(--rgb-primary) / <alpha-value>)',
                surface: 'rgb(var(--rgb-parchment) / <alpha-value>)',
                onSurface: 'rgb(var(--rgb-ink) / <alpha-value>)',
              }
            }
          },
          fontFamily: {
            header: ['Cormorant Garamond', 'serif'],
            sans: ['Instrument Sans', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      /* LIGHT THEME */
      --rgb-parchment: 242 240 236; /* Warmer, cleaner white */
      --rgb-ink: 10 25 47;         /* Deep Navy */
      --rgb-mica: 255 255 255;
      --rgb-primary: 3 64 120;
    }

    [data-theme="dark"] {
      /* DARK THEME - True OLED Black/Blue */
      --rgb-parchment: 5 10 20;    /* Almost black */
      --rgb-ink: 230 230 230;      /* Off-white text */
      --rgb-mica: 13 25 45;        /* Card background */
      --rgb-primary: 100 181 246;
    }

    [data-theme="sepia"] {
      /* SEPIA THEME - Serious Archival */
      --rgb-parchment: 236 228 217;
      --rgb-ink: 60 45 35;         /* Dark Brown */
      --rgb-mica: 245 238 225;
      --rgb-primary: 140 70 30;
    }
    
    body {
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Instrument Sans', sans-serif;
      overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
      touch-action: manipulation;  /* Removes tap delay */
      -webkit-tap-highlight-color: transparent;
    }

    /* Android Device Shell / Viewport */
    .android-device {
      width: 100%;
      height: 100vh; /* Fallback */
      height: 100dvh; /* Dynamic viewport height */
      max-width: 480px; /* Constrain on desktop, full on mobile */
      background: rgb(var(--rgb-parchment));
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }
    
    @media (min-width: 481px) {
      .android-device {
        height: 850px;
        border-radius: 40px;
        border: 8px solid #333;
      }
    }

    .screen {
      flex: 1;
      background-color: rgb(var(--rgb-parchment));
      color: rgb(var(--rgb-ink));
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 100px; /* Space for FAB/Nav */
    }
    
    /* Custom Scrollbar for desktop, hidden on mobile */
    .scroll-container::-webkit-scrollbar { width: 4px; }
    .scroll-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

    /* Navigation */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(80px + env(safe-area-inset-bottom));
      background: rgba(var(--rgb-parchment), 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(var(--rgb-ink), 0.05);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 12px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 50;
    }

    /* Floating Action Button */
    .fab {
      position: absolute;
      bottom: calc(90px + env(safe-area-inset-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: rgb(var(--rgb-primary));
      color: rgb(var(--rgb-parchment));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 60;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fab:active { transform: scale(0.9); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.sh/@google/genai@^1.36.0",
      "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
      "vite": "https://esm.sh/vite@^7.3.1",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
    }
  }
  </script>
</head>
<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
