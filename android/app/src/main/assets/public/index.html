<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E4DFDA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#011D4D" media="(prefers-color-scheme: dark)">
  <title>Sapphic Shelves | Android Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Sanchez:ital@0;1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            parchment: 'rgb(var(--rgb-parchment) / <alpha-value>)',
            ink: 'rgb(var(--rgb-ink) / <alpha-value>)',
            'mica-surface': 'rgb(var(--rgb-mica) / <alpha-value>)',

            // UPDATED PALETTE: Calming Desaturated Rainbow
            brand: {
              deep: '#6574bf',   // Blue (Replacing Dark Blue)
              cyan: '#85c183',   // Green (Replacing Cyan)
              glow: '#e7df8e',   // Yellow
            },
            rose: '#ba6b6b',     // Red
            gold: '#d4a576',     // Orange (Used for stars/accents)
            plum: '#6574bf',     // Blue (Mapped to Deep)
            sunset: '#ba6b6b',   // Red

            // Specific Palette Reference
            'calm-red': '#EB7171',
            'calm-orange': '#F0B965',
            'calm-yellow': '#FFF68A',
            'calm-green': '#9FBFA3',
            'calm-blue': '#A3CDD9',

            md: {
              sys: {
                primary: 'rgb(var(--rgb-primary) / <alpha-value>)',
                surface: 'rgb(var(--rgb-parchment) / <alpha-value>)',
                onSurface: 'rgb(var(--rgb-ink) / <alpha-value>)',
              }
            }
          },
          fontFamily: {
              header: ['"DM Serif Display"', 'serif'],
               sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      /* LIGHT THEME */
      --rgb-parchment: #9FBFA3;
      --rgb-ink: 31 31 12;
      --rgb-mica: 255 255 255;
      --rgb-primary: #9fbfa3; /* Matches calm-blue */
    }

    [data-theme="dark"] {
      /* DARK THEME */
      --rgb-parchment: 30 30 35;
      --rgb-ink: 230 230 230;
      --rgb-mica: 45 45 50;
      --rgb-primary: 133 193 131; /* Matches calm-green */
    }

    [data-theme="sepia"] {
      /* SEPIA THEME */
      --rgb-parchment: 236 228 217;
      --rgb-ink: 90 70 60;
      --rgb-mica: 245 238 225;
      --rgb-primary: 212 165 118; /* Matches calm-orange */
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: rgb(var(--rgb-primary));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Inter', sans-serif;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .android-device {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgb(var(calm-blue));
      transform: translateZ(0);
    }

    @media (min-width: 481px) {
      body {
        background-color: #111;
      }
      .android-device {
        height: 850px;
        width: 400px;
        border-radius: 65px;
        border: 12px solid #333;
        box-shadow: 0 0 120px rgba(192,5,12,0.9);
      }
      .android-device ::-webkit-scrollbar {
        display: none;
      }
    }

    .screen {
      flex: 1;
      background-color: rgb(var(--rgb-primary));
      color: rgb(var(--rgb-ink));
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-bottom: 100px;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(70px + env(safe-area-inset-bottom));
      background: rgba(var(--204 229 255), 0.9);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-top: 1px solid rgba(var(--rgb-ink), 0.05);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 10px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 50;
    }

    .fab {
      position: absolute;
      bottom: calc(85px + env(safe-area-inset-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: #9FBFA3; /* calm-blue */
      color: #8CC5CF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 60;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fab:active { transform: scale(0.9); }
  </style>
</head>
<body class="antialiased">
  <div id="root" style="width: 100%; height: 100%; display: flex; justify-content: center;"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
